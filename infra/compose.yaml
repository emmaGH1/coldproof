name: coldproof

services:
  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: coldproof
      POSTGRES_USER: coldproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../web/db/001_events.sql:/docker-entrypoint-initdb.d/001_events.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldproof -d coldproof"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build: ../web
    environment:
      DATABASE_URL: postgres://coldproof:${POSTGRES_PASSWORD}@postgres:5432/coldproof
      INGEST_TOKEN: ${INGEST_TOKEN:?Run scripts/setup first}
      HORNET_URL: http://iota-hornet:14265
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  messages-api:
    build: ../messages-api
    environment:
      HORNET_URL: http://iota-hornet:14265
      TRACEABILITY_URL: http://web:3000/api/ingest
      INGEST_TOKEN: ${INGEST_TOKEN}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - forwarding-outbox:/app/outbox

volumes:
  postgres-data:
  forwarding-outbox:

networks:
  default:
    external: true
    name: iota-net
